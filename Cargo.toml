[package]
name = "rusm"
version = "0.1.0"
edition = "2024"
description = "An assembly REPL: run snippets and watch registers and memory. A Rust port of rappel."
repository = "https://github.com/Narachara/rusm"
license-file = "LICENSE"
readme = "README.md"
keywords = ["assembly", "repl", "ptrace", "disassembler", "nasm"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "intel"] }
libc = "0.2.189"
nix = { version = "0.31.3", features = ["ptrace", "process", "signal"] }
ratatui = "0.30.2"
tempfile = "3.27.0"
